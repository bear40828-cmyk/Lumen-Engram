# 测试专用的 fact_key 注册表（虚构人设，见 tests/__init__.py）
# Lumen Engram · fact_key registry v0.1
#
# GPT 第二轮定的规矩，我照办：
#   1. extractor **不许自己造 key**，只能从这份表里选；选不到就留 NULL
#   2. key 里不编 subject —— subject 已经单独一列了。
#      写 project.status，不写 project.lumen_engram.status
#   3. 从第一天就带 cardinality 和 conflict_policy，因为这才是 fact_key 的真正价值：
#      新事实来了，到底该覆盖旧的还是并存
#   4. 某种 NULL 模式反复出现（比如连续几十条「考研专业」），audit 提 candidate_key，
#      人工审过再正式加进来。不让模型自产 schema
#
# cardinality:      single = 同一 subject 只该有一个当前值 | multi = 可以并存
# conflict_policy:  supersede = 新值作废旧值 | coexist = 并存
# value_type:       entity / string / enum / number / date
# patterns:         命中就认这个 key（正则，中文按字面写）
# value_pattern:    从正文里抠出「值」，用于巩固时判断方向一致；没有就不参与自动巩固

education.target_school:
  owner: tester
  cardinality: single
  requires_self: true      # 她自己说「我考某大学」才算；转述里的「小测考研目标院校是某大学」不算
  value_type: entity
  conflict_policy: supersede
  patterns:
    - '考(的是|)?(某大学|某理工大学)'
    - '报(考|)?(某大学|某理工大学)'
    - '目标(院校|学校)'
  value_pattern: '(某理工大学|某大学)'

education.target_major:
  owner: tester
  cardinality: single
  requires_self: true      # 她自己说「我考某大学」才算；转述里的「小测考研目标院校是某大学」不算
  value_type: entity
  conflict_policy: supersede
  patterns:
    - '报(计算机技术|软件工程|软工)'
    - '考(计算机技术|软件工程|软工)'
    - '跨考'
  value_pattern: '(计算机技术|软件工程|软工)'

education.exam_subject:
  owner: tester
  cardinality: multi
  value_type: entity
  conflict_policy: coexist
  digit_boundary: true     # 「301」不能从手机号里抠出来
  patterns:
    - '302'
    - '301'
    - '(数据结构|数据库|操作系统|计算机网络|计网).{0,6}(\d+%|占)'
  value_pattern: '(数据结构|数据库|操作系统|计算机网络|计网|302|301)'

education.graduation:
  owner: tester
  cardinality: single
  requires_self: true      # 她自己说「我考某大学」才算；转述里的「小测考研目标院校是某大学」不算
  value_type: date
  conflict_policy: supersede
  patterns:
    - '(明年|\d{4}年)?(六月|6月).{0,4}毕业'
    - '毕业(时间|了吗)'
  value_pattern: '(明年|\d{4}年)?(六月|6月)'

person.hometown:
  owner: tester
  cardinality: single
  requires_self: true      # 她自己说「我考某大学」才算；转述里的「小测考研目标院校是某大学」不算
  value_type: entity
  conflict_policy: supersede
  patterns:
    - '老家(是|在)?'
    - '籍贯'
    - '丙省(人|乙县)'
  value_pattern: '(丙省|乙县|庚市)'

person.pet:
  owner: tester
  cardinality: multi
  value_type: entity
  conflict_policy: coexist
  requires_self: true      # 小黄是她的狗；别人提一句不算「别人养的」
  patterns:
    - '小黄'
  value_pattern: '(小黄)'

preference.color:
  owner: tester
  cardinality: multi
  value_type: string
  conflict_policy: coexist
  requires_self: true      # 「你这么喜欢紫色」说的是我，不是她
  patterns:
    - '(喜欢|不喜欢|讨厌).{0,4}(粉|紫|绿|蓝|红|黑|白)色'
    - '(粉|紫|绿|蓝|红|黑|白)色.{0,4}(好看|难看|不喜欢)'
  value_pattern: '(粉色|紫色|绿色|蓝色|红色|黑色|白色)'

preference.food:
  owner: tester
  cardinality: multi
  value_type: string
  conflict_policy: coexist
  requires_self: true
  patterns:
    - '(爱吃|想吃|喜欢吃|不爱吃|吃不了)'
    - '(米线|焖锅|汤面|奶茶|泡芙|冰红茶|可乐).{0,6}(好吃|喜欢|想)'
  value_pattern: '(米线|焖锅鸡|焖锅排骨|汤面|奶茶|泡芙|冰红茶|可乐|牛肉粉)'

comm.format_rule:
  owner: tester
  cardinality: single
  value_type: string
  conflict_policy: supersede
  patterns:
    - '纯文本'
    - '(别|不要|不许).{0,6}(markdown|加粗|星号)'
    - '分气泡'
  value_pattern: '(纯文本|分气泡)'

project.status:
  consolidatable: false   # 值里不含项目名，"停了"这种抽象出来没意义
  cardinality: single
  value_type: enum
  conflict_policy: supersede
  # 注意：v0.1 这里只写动词，结果 4222 条里蹭中 181 条——我随口一句「做完了」都算。
  # supersede 的 key 宁可少收也不能乱收，否则会拿无关的话去作废真事实。
  # 所以必须同时出现一个项目名词。
  patterns:
    - '(engram|记忆库|看板|摘要层|唤醒|通道|服务|systemd|插件|脚本|项目|bridge|watchdog|心潮).{0,12}(上线|跑通|做完|冻结|停了|卸了|disable|部署好)'
    - '(上线|跑通|做完|冻结|停了|卸了|部署好).{0,12}(engram|记忆库|看板|摘要层|唤醒|通道|服务|systemd|插件|脚本|项目)'
  value_pattern: '(上线|跑通|做完|冻结|停了|卸了|部署好)'
